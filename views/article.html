```
<!-- Article page header -->
<header class="container py-4">
    <h1>⚜️ Motor Gazette</h1>
</header>

<!-- Article content -->
<main class="container py-5">
    <article>
        <h1 id="article-title">Loading article...</h1>

        <p id="article-meta" class="text-muted">
            Loading article information...
        </p>

        <div id="article-content">
            Loading article content...
        </div>
    </article>
</main>
```
<!-- Load the article from the API -->
<script>
    // Get the article ID from the URL
    const articleId = window.location.pathname.split('/').pop();

    // Fetch the requested article
    async function loadArticle() {
        try {
            const response = await fetch(`/api/articles/${articleId}`);

            const article = await response.json();

            if (!response.ok) {
                throw new Error(article.error || 'Article not found.');
            }

            // Display the article information
            document.getElementById('article-title').textContent =
                article.title;

            document.getElementById('article-meta').textContent =
                `Published ${article.date} by ${article.author}`;

            document.getElementById('article-content').textContent =
                article.content;

        } catch (error) {
            console.error('Error loading article:', error);

            document.getElementById('article-title').textContent =
                'Article not found.';

            document.getElementById('article-meta').textContent = '';

            document.getElementById('article-content').textContent =
                'Unable to load this article.';
        }
    }

    // Load the article when the page opens
    loadArticle();
</script>

</body>
</html>


name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ci-test-session-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Application health check
        run: |
          npm start > app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          for i in {1..15}; do
            if curl --fail --silent http://localhost:3000/ > /dev/null &&
               curl --fail --silent http://localhost:3000/api/articles > /dev/null; then
              echo "Application and database checks passed."
              exit 0
            fi

            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "Application stopped unexpectedly. Startup logs:"
              cat app.log
              exit 1
            fi

            sleep 2
          done

          echo "Health check failed. Application logs:"
          cat app.log
          exit 1

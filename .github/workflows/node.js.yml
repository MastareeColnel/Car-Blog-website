name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      # Get the project code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Check that the application starts correctly
      - name: Start application check
        run: |
          npm start &
          sleep 5
          curl --fail http://localhost:3000/api/articles